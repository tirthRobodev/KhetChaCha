
name: KhetChacha Android Release & Distribution

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      distribute_to_firebase:
        description: Distribute APK to Firebase testers
        required: true
        type: boolean
        default: true

      custom_release_notes:
        description: Optional release notes
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: khetchacha-android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '17'
  DEFAULT_FIREBASE_APP_ID: '1:342078322934:android:17882ed9e3b63e95ca14d7'
  DEFAULT_TESTER_GROUP: 'khetchacha-testers'

jobs:
  validate:
    name: Validate Flutter Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Analysis
        run: flutter analyze

      - name: Run Flutter Tests
        run: flutter test

  build_and_distribute:
    name: Build Signed APK and Distribute
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Check Required Signing Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub secret: $name"
              exit 1
            fi
          done

          echo "All release signing secrets are configured."

      - name: Restore Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -e
          mkdir -p android/app
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/khetchacha-release.jks

          test -s android/app/khetchacha-release.jks
          echo "Release keystore restored successfully."

      - name: Compute Version
        shell: bash
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          BASE_VERSION="${RAW_VERSION%%+*}"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"

          echo "BASE_VERSION=$BASE_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

          echo "Building KhetChacha v${BASE_VERSION}+${BUILD_NUMBER}"

      - name: Build Signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name="${{ env.BASE_VERSION }}" \
            --build-number="${{ env.BUILD_NUMBER }}"

      - name: Verify APK
        shell: bash
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          ls -lh "$APK_PATH"

      - name: Verify APK Release Signature
        shell: bash
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::Android apksigner was not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KhetChacha-v${{ env.BASE_VERSION }}-build-${{ env.BUILD_NUMBER }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare Release Notes
        id: release_notes
        shell: bash
        env:
          CUSTOM_NOTES: ${{ github.event.inputs.custom_release_notes }}
        run: |
          if [ -n "$CUSTOM_NOTES" ]; then
            NOTES="$CUSTOM_NOTES"
          else
            NOTES="KhetChacha v${{ env.BASE_VERSION }} - Build ${{ env.BUILD_NUMBER }}. Latest Android testing release."
          fi

          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check Firebase Credentials
        id: firebase_check
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
            echo "Firebase credentials are available."
          else
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is missing."
            exit 1
          fi

      - name: Distribute APK to Firebase Testers
        if: ${{ github.event_name == 'push' || inputs.distribute_to_firebase }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID || env.DEFAULT_FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: ${{ vars.FIREBASE_TESTER_GROUP || env.DEFAULT_TESTER_GROUP }}
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: ${{ steps.release_notes.outputs.notes }}

      - name: Release Summary
        if: always()
        run: |
          echo "KhetChacha Android Release" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: ${{ env.BASE_VERSION }}+${{ env.BUILD_NUMBER }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Package: com.example.khetchacha" >> "$GITHUB_STEP_SUMMARY"
          echo "Firebase tester group: ${{ vars.FIREBASE_TESTER_GROUP || env.DEFAULT_TESTER_GROUP }}" >> "$GITHUB_STEP_SUMMARY"
